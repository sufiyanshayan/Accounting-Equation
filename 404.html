<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>

<!-- Favicon -->
<link rel="icon" type="image/png" href="https://i.postimg.cc/W1K2DMnR/FB-IMG-1772458005044.jpg">
<style>
  :root{
    --bg-0:#020617;
    --bg-1:#071a52;
    --bg-2:#0b3b91;
    --accent:#0066ff;
    --cyan:#5eead4;
    --ice:#bcdcff;
    --glass:rgba(255,255,255,0.06);
    --glass-border:rgba(255,255,255,0.14);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--bg-0);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow:hidden;
  }

  body{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ice);
  }

  /* Base gradient */
  .bg-gradient{
    position:fixed;
    inset:0;
    background:
      radial-gradient(1200px 800px at 20% 15%, rgba(11,59,145,0.55), transparent 60%),
      radial-gradient(1000px 700px at 85% 80%, rgba(0,102,255,0.35), transparent 55%),
      linear-gradient(160deg, var(--bg-0) 0%, var(--bg-1) 45%, var(--bg-0) 100%);
    z-index:0;
  }

  /* Grid overlay */
  .grid-overlay{
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(94,234,212,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(94,234,212,0.05) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 40%, transparent 90%);
    z-index:1;
    animation: gridDrift 40s linear infinite;
  }

  @keyframes gridDrift{
    0%{ background-position: 0 0, 0 0; }
    100%{ background-position: 48px 96px, 96px 48px; }
  }

  /* Blurred orbs */
  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(70px);
    opacity:0.55;
    z-index:1;
    will-change:transform;
  }
  .orb-a{
    width:420px; height:420px;
    background:radial-gradient(circle, var(--accent), transparent 70%);
    top:-120px; left:-100px;
    animation: floatA 16s ease-in-out infinite;
  }
  .orb-b{
    width:360px; height:360px;
    background:radial-gradient(circle, var(--cyan), transparent 70%);
    bottom:-140px; right:-80px;
    animation: floatB 20s ease-in-out infinite;
  }
  .orb-c{
    width:280px; height:280px;
    background:radial-gradient(circle, #3b82f6, transparent 70%);
    top:40%; right:10%;
    opacity:0.35;
    animation: floatC 24s ease-in-out infinite;
  }

  @keyframes floatA{
    0%,100%{ transform:translate(0,0); }
    50%{ transform:translate(60px,50px); }
  }
  @keyframes floatB{
    0%,100%{ transform:translate(0,0); }
    50%{ transform:translate(-50px,-40px); }
  }
  @keyframes floatC{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-30px,30px) scale(1.1); }
  }

  /* Cursor glow */
  .cursor-glow{
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    pointer-events:none;
    background:radial-gradient(circle, rgba(0,102,255,0.18), transparent 65%);
    transform:translate(-50%,-50%);
    z-index:2;
    transition:opacity 0.3s ease;
    opacity:0;
  }

  /* Particles */
  .particles{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
  }
  .particle{
    position:absolute;
    border-radius:50%;
    background:var(--cyan);
    opacity:0.5;
    box-shadow:0 0 8px var(--cyan);
    animation: rise linear infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:0.6; }
    90%{ opacity:0.4; }
    100%{ transform:translateY(-110vh) translateX(20px); opacity:0; }
  }

  /* Content */
  .stage{
    position:relative;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:56px 44px;
    width:min(680px, 90vw);
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:28px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:
      0 8px 40px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.08);
    animation: enter 1s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes enter{
    0%{ opacity:0; transform:translateY(28px) scale(0.97); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }

  .code{
    font-size:clamp(96px, 18vw, 168px);
    font-weight:800;
    line-height:1;
    margin:0 0 8px 0;
    letter-spacing:-4px;
    background:linear-gradient(120deg, #ffffff 0%, var(--cyan) 35%, var(--accent) 70%, #7dd3fc 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    position:relative;
    filter: drop-shadow(0 0 28px rgba(0,102,255,0.55));
    animation: pulseGlow 4s ease-in-out infinite;
  }

  @keyframes pulseGlow{
    0%,100%{ filter: drop-shadow(0 0 22px rgba(0,102,255,0.45)); }
    50%{ filter: drop-shadow(0 0 42px rgba(94,234,212,0.55)); }
  }

  .code::selection{ background:var(--accent); color:#fff; }

  .divider{
    width:64px;
    height:3px;
    border-radius:2px;
    background:linear-gradient(90deg, transparent, var(--cyan), transparent);
    margin:6px 0 22px 0;
    opacity:0.8;
  }

  h1{
    margin:0 0 14px 0;
    font-size:clamp(22px, 3.4vw, 32px);
    font-weight:700;
    color:#f2f7ff;
    letter-spacing:-0.3px;
  }

  p.desc{
    margin:0 0 34px 0;
    font-size:clamp(14px, 2vw, 16px);
    line-height:1.6;
    color:rgba(188,220,255,0.75);
    max-width:46ch;
  }

  .actions{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
  }

  .btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:14px 30px;
    font-size:15px;
    font-weight:600;
    border-radius:999px;
    cursor:pointer;
    border:none;
    outline:none;
    font-family:inherit;
    transition:transform 0.35s cubic-bezier(.2,.9,.3,1.3), box-shadow 0.35s ease, background 0.35s ease;
    -webkit-tap-highlight-color:transparent;
  }

  .btn:focus-visible{
    outline:2px solid var(--cyan);
    outline-offset:3px;
  }

  .btn-primary{
    color:#031126;
    background:linear-gradient(120deg, #7dd3fc, var(--accent) 55%, #3b82f6);
    box-shadow:0 8px 28px rgba(0,102,255,0.4), 0 0 0 rgba(94,234,212,0);
  }
  .btn-primary:hover{
    transform:translateY(-3px);
    box-shadow:0 14px 34px rgba(0,102,255,0.55), 0 0 24px rgba(94,234,212,0.35);
  }
  .btn-primary:active{
    transform:translateY(-1px) scale(0.98);
  }

  .btn-secondary{
    color:var(--ice);
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.18);
  }
  .btn-secondary:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,0.1);
    border-color:rgba(94,234,212,0.5);
    box-shadow:0 10px 26px rgba(0,0,0,0.35);
  }
  .btn-secondary:active{
    transform:translateY(-1px) scale(0.98);
  }

  .btn svg{ width:16px; height:16px; }

  footer.tag{
    margin-top:30px;
    font-size:12px;
    letter-spacing:0.4px;
    color:rgba(188,220,255,0.35);
  }

  @media (max-width:520px){
    .stage{ padding:40px 24px; border-radius:22px; }
    .actions{ flex-direction:column; width:100%; }
    .btn{ width:100%; }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
    }
  }
</style>
</head>
<body>

  <div class="bg-gradient"></div>
  <div class="grid-overlay"></div>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
  <div class="cursor-glow" id="cursorGlow"></div>
  <div class="particles" id="particles"></div>

  <main class="stage">
    <div class="code" aria-hidden="true">404</div>
    <div class="divider"></div>
    <h1>Oops! Page Not Found</h1>
    <p class="desc">Looks like you followed a broken link or entered a URL that doesn’t exist on our site.</p>

    <div class="actions">
      <button class="btn btn-primary" id="homeBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        Go Back Home
      </button>
      <button class="btn btn-secondary" id="backBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18 5 12l6-6"/></svg>
        Go Back
      </button>
    </div>

    <footer class="tag">ERROR CODE · 404 NOT FOUND</footer>
  </main>

<script>
  // Navigation
  document.getElementById('homeBtn').addEventListener('click', function(){
    window.location.href = '/';
  });
  document.getElementById('backBtn').addEventListener('click', function(){
    window.history.back();
  });

  // Cursor-following glow (desktop only)
  var glow = document.getElementById('cursorGlow');
  var isTouch = window.matchMedia('(pointer: coarse)').matches;
  if(!isTouch){
    window.addEventListener('mousemove', function(e){
      glow.style.opacity = '1';
      glow.style.left = e.clientX + 'px';
      glow.style.top = e.clientY + 'px';
    });
    window.addEventListener('mouseleave', function(){
      glow.style.opacity = '0';
    });
  }

  // Floating particles
  (function(){
    var container = document.getElementById('particles');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var count = window.innerWidth < 600 ? 16 : 32;
    if(reduce) count = 0;

    for(var i=0; i<count; i++){
      var p = document.createElement('div');
      p.className = 'particle';
      var size = 2 + Math.random() * 3;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.bottom = (-10 - Math.random() * 20) + 'px';
      var duration = 10 + Math.random() * 14;
      p.style.animationDuration = duration + 's';
      p.style.animationDelay = (Math.random() * duration) + 's';
      container.appendChild(p);
    }
  })();
</script>
</body>
</html>
