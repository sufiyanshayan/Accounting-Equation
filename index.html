<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Accounting-Equation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-right:4px}
:root{
  --bg:#eef0f3; --panel:#fff; --ink:#111; --muted:#5b6470; --line:#c9ced6; --accent:#1f4e79; --accent-ink:#fff;
  --ok:#0a7a3c; --bad:#b3261e; --warn:#8a5a00; --paper:#fff; --paper-ink:#111; --paper-line:#444;
  --font:"Noto Sans Bengali","Kalpurush","SolaimanLipi","Siyam Rupali","Nirmala UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14171b;--panel:#1d2127;--ink:#e8eaed;--muted:#9aa3ad;--line:#38404a;--accent:#7fb2e5;--accent-ink:#0c1b2b;--ok:#4cc38a;--bad:#ff8a80;--warn:#e0b050}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;padding-bottom:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#lock[hidden]{display:none}
.lbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.lbox h2{font-size:1.15rem}.lbox label{display:flex;flex-direction:column;gap:4px;font-size:.9rem}.lbox input{padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit}
.lbrand{font-weight:700;color:var(--muted,#667);font-size:.9rem}.lsub{color:var(--muted,#667);font-size:.9rem;margin-top:-6px}.pw{display:flex;gap:6px}.pw input{flex:1;min-width:0}.lbox .errs{min-height:1.2em;color:#b00020;font-size:.85rem}.lbox code{word-break:break-all;font-size:.8rem}.lbtns{display:flex;gap:8px;justify-content:flex-end}
body.locked .topbar,body.locked main{display:none}
.topbar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.brand{font-weight:700;font-size:1.05rem;margin-right:auto}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:8px;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 9px;min-height:30px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
nav.tabs button.on{color:var(--accent);border-top-color:var(--accent);font-weight:700}
main{max-width:1280px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2,.card h3{margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.row>label{display:flex;flex-direction:column;gap:2px;font-size:.82rem;color:var(--muted)}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;max-width:100%}
textarea{width:100%;min-height:70px}
.grow{flex:1;min-width:140px}
.muted{color:var(--muted)} .ok{color:var(--ok)} .bad{color:var(--bad)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.plain{border-collapse:collapse;width:100%}
table.plain th,table.plain td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.plain th{font-size:.82rem;color:var(--muted);white-space:nowrap}
/* ---- the reference-faithful statement ---- */
.paper{background:var(--paper);color:var(--paper-ink);padding:18px 14px;border:1px solid var(--line);border-radius:6px}
.paper h1{font-size:1.25rem;text-align:center;margin:4px 0;font-weight:700}
.paper h2.sub{font-size:1.1rem;text-align:center;margin:6px 0 16px;font-weight:400}
table.eq{border-collapse:collapse;width:100%;min-width:900px;font-size:.98rem;color:var(--paper-ink)}
table.eq th,table.eq td{border:1px solid var(--paper-line);padding:3px 8px;text-align:center;vertical-align:middle;font-variant-numeric:tabular-nums}
table.eq thead th{font-weight:500;background:var(--paper)}
table.eq td.sym{width:28px;padding:0 2px}
table.eq td.dt{text-align:left;vertical-align:bottom;white-space:nowrap;min-width:92px}
table.eq td.lab{white-space:nowrap}
table.eq td.cm{text-align:center;min-width:120px}
table.eq tr.top td{border-bottom:0} table.eq tr.bot td{border-top:0}
table.eq tr.top td.sym,table.eq tr.bot td.sym{border-top:0}
table.eq tr.tot td{font-weight:700;font-size:1.05rem}
table.eq .acts button{border:1px solid #999;background:#fff;color:#111;border-radius:6px;padding:1px 7px;font-size:.78rem;margin:0 2px}
.check{padding:10px 14px;border-radius:8px;margin-top:14px;border:1px solid var(--line);font-weight:600}
.check.good{border-color:var(--ok);color:var(--ok)} .check.fail{border-color:var(--bad);color:var(--bad);background:rgba(179,38,30,.08)}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;width:min(720px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog .hd{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between}
dialog .bd{padding:16px;overflow:auto;max-height:68vh}
dialog .ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.errs{color:var(--bad);font-size:.9rem;margin:8px 0;padding-left:18px}
.lines td{padding:4px}
.lines input,.lines select{width:100%}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;display:none;max-width:92vw;gap:12px;align-items:center}
#toast button{background:none;border:1px solid #fff;color:#fff;border-radius:6px;padding:2px 10px;margin-left:10px}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted)}
.void{opacity:.6;text-decoration:line-through}
pre.json{white-space:pre-wrap;word-break:break-all;font-size:.76rem;background:var(--bg);padding:8px;border-radius:8px;max-height:220px;overflow:auto}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button.on{background:var(--accent);color:var(--accent-ink)}
body.v-eq{background:#fff}
body.v-eq .topbar{background:#fff}
body.v-eq .card.eqcard{background:none;border:0;padding:0;margin:0}
body.v-eq .paper{border:0;padding:8px 0}
table.eq tr[data-id]:hover td{background:#f4f8fc}
.ce{display:block;min-height:1.6em;min-width:1.5em;padding:2px 4px;outline:none;cursor:text;border-radius:3px;white-space:pre-wrap;word-break:break-word}
.ce:focus{background:#fff8d6;box-shadow:inset 0 0 0 2px #1f4e79}
h1 .ce,h2 .ce{display:inline-block;min-width:8em}
table.eq tr.pend td{background:#fff3f0}
.emenu{position:fixed;right:8px;top:56px;max-width:calc(100vw - 16px);z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);min-width:230px;padding:4px}
.emenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;font-size:.95rem}
.emenu button:hover{background:var(--bg)}
.rmf{display:none;margin-left:4px;color:#b3261e;cursor:pointer;font-size:.9rem}
th:hover .rmf{display:inline}
.perr-row{color:#b3261e;font-size:.85rem;text-align:left!important;background:#fff3f0}
@media (max-width:700px){
  main{padding:10px}
  .brand{font-size:.95rem}
}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;padding:0;color:#000}
  .topbar,nav.tabs,.fab,.noprint,#toast,dialog{display:none!important}
  main{max-width:none;padding:0}
  .card{border:0;padding:0;margin:0}
  .paper{border:0;padding:0}
  .notebox{border:1px solid #000;resize:none}
  .scroll{overflow:visible}
  table.eq{min-width:0;font-size:11pt}
  .paper table.eq,.paper .scroll.tblwrap{display:table!important}
  .perr,.rmf{display:none!important}
  .ce:focus{background:none;box-shadow:none}
  .view{display:none} .view.printing{display:block!important}
}
</style>
</head>
<body>
<header class="topbar noprint">
  <div class="brand"><button class="btn sm" id="btnBack" data-act="goEq" style="display:none">← টেবিলে ফিরুন</button></div>
  <span style="position:relative"><button class="btn sm primary" data-act="toggleEdit" id="btnEdit"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 4H8a4 4 0 0 0-4 4v8a4 4 0 0 0 4 4h8a4 4 0 0 0 4-4v-2.5"/><path d="M9 15.2 10 11.6 17.4 4.2a1.7 1.7 0 0 1 2.4 0l.4.4a1.7 1.7 0 0 1 0 2.4L12.8 14.4Z"/><path d="m15.3 6.3 2.4 2.4"/></svg>Edit</button>
    <div id="editMenu" class="emenu" hidden>
      <button data-act="newEntry">＋ সারি</button>
      <button data-act="rmRow">－ সারি</button>
      <button data-act="addCol" data-t="asset">＋A</button>
      <button data-act="rmCol" data-t="asset">－A</button>
      <button data-act="addCol" data-t="liability">＋L</button>
      <button data-act="rmCol" data-t="liability">－L</button>
    </div></span>
  <button class="btn sm" data-act="undo" id="btnUndo" title="পূর্বাবস্থা">Undo</button>
  <button class="btn sm" data-act="redo" id="btnRedo" title="আবার করুন">Redo</button>
  <button class="btn sm" data-act="logout" id="btnLogout" hidden>Logout</button>
</header>
<main id="main"></main>
<div id="toast"></div>
<div id="lock" hidden></div>
<dialog id="dlg"></dialog>

<script src="config.js"></script>
<script>
"use strict";
const ICON_EDIT = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 4H8a4 4 0 0 0-4 4v8a4 4 0 0 0 4 4h8a4 4 0 0 0 4-4v-2.5"/><path d="M9 15.2 10 11.6 17.4 4.2a1.7 1.7 0 0 1 2.4 0l.4.4a1.7 1.7 0 0 1 0 2.4L12.8 14.4Z"/><path d="m15.3 6.3 2.4 2.4"/></svg>';
const ICON_TRASH = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4.8A.8.8 0 0 1 9.8 4h4.4a.8.8 0 0 1 .8.8V7"/><path d="M6.2 7l.8 11.4A2 2 0 0 0 9 20.2h6a2 2 0 0 0 2-1.8L17.8 7"/><path d="M10 11v5.5M14 11v5.5"/></svg>';

/* সংযোগ ও টেবিলের নাম config.js ফাইল থেকে আসে */
const CFG = window.APP_CONFIG || {}, SB = CFG.supabase || {};
const TABLE = CFG.table || "", RPC_SAVE = TABLE + "_save_entry", RPC_RESTORE = TABLE + "_restore_backup";

/* =====================================================================
   শিরোনাম ও উপশিরোনাম — এখানে বদলান (পাতায় চাপ দিয়ে বদলানো যায় না)।
   SUBTITLE-এ যা লিখবেন হুবহু তাই দেখাবে। চাইলে সময়কাল অনুযায়ী নিজে বদলানোর জন্য
   {বছর}  {মাস}  {থেকে}  {পর্যন্ত} চিহ্ন বসাতে পারেন। খালি "" রাখলে কিছুই দেখাবে না।
   ===================================================================== */
const PAGE_TITLE = "Accounting-Equation";
const SUBTITLE = "INYT 444";
const SDK_URL = CFG.sdkUrl || "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js";
const LS_DATA = "hisab_eq_v1", LS_SNAP = "hisab_eq_presnap";
const APP = "hisab-eq", APP_VERSION = 1;

/* ---------------- utils ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); }));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nowIso = () => new Date().toISOString();
const BN = "০১২৩৪৫৬৭৮৯";
const MONTHS = ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন", "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"];
const MSHORT = ["জানু", "ফেব্রু", "মার্চ", "এপ্রিল", "মে", "জুন", "জুলাই", "আগস্ট", "সেপ্টে", "অক্টো", "নভে", "ডিসে"];
const TYPE_BN = { asset: "সম্পদ", liability: "দায়", equity: "মালিকানা স্বত্ব", revenue: "আয়", expense: "ব্যয়" };
const KIND_BN = { cash: "নগদ", bank: "ব্যাংক", receivable: "প্রাপ্য", inventory: "মজুদ", equipment: "যন্ত্রপাতি/স্থায়ী", loan: "ঋণ", payable: "প্রদেয়", capital: "মূলধন", drawings: "উত্তোলন", other: "অন্যান্য" };

function D(str) { str = String(str); return S.settings.digits === "bn" ? str.replace(/[0-9]/g, d => BN[d]) : str; }
function groupInt(s) { if (s.length <= 3) return s; const l = s.slice(-3); return s.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ",") + "," + l; }
function fmt(p, o = {}) { // p: integer paisa
  const neg = p < 0, a = Math.abs(p), t = Math.floor(a / 100), f = a % 100;
  let s = groupInt(String(t)); if (f) s += "." + String(f).padStart(2, "0");
  s = D(s); return (neg ? "−" : (o.plus && p > 0 ? "+" : "")) + (o.cur ? "৳" : "") + s;
}
function fmtAbs(p) { return fmt(Math.abs(p)); }
function parseAmt(str) {
  if (str == null) return NaN; let s = String(str).trim(); if (s === "") return 0;
  s = s.replace(/[০-৯]/g, c => BN.indexOf(c)).replace(/[,\s৳]/g, "").replace("।", ".");
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return NaN;
  const [i, f = ""] = s.split("."); const p = parseInt(i, 10) * 100 + parseInt((f + "00").slice(0, 2), 10);
  return p > 99999999999999 ? NaN : p;
}
function validDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s) && new Date(s + "T00:00:00Z").toISOString().slice(0, 10) === s; }
function ymd(s) { return s.split("-").map(Number); }
function dShort(s, withYear) { const [y, m, d] = ymd(s); return (withYear ? D(y) + " " : "") + MSHORT[m - 1] + ":" + (withYear ? "" : " ") + D(d); }
function dLong(s) { const [y, m, d] = ymd(s); return D(d) + " " + MONTHS[m - 1] + " " + D(y); }
function lastDay(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function pad(n) { return String(n).padStart(2, "0"); }
function toast(msg, action) {
  const t = $("#toast"); t.innerHTML = esc(msg) + (action ? `<button data-act="${action.act}">${esc(action.label)}</button>` : ""); t.style.display = "flex";
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = "none", action ? 8000 : 4500);
}

/* ---------------- state ---------------- */
function defaultAccounts() {
  const A = (code, name, type, kind, showCol, sort) => ({ id: uuid(), code, name, type, kind, showCol, active: true, sort });
  return [
    A("1010", "নগদ", "asset", "cash", true, 10), A("1020", "ব্যাংক", "asset", "bank", false, 20),
    A("1030", "দেনাদার/প্রাপ্য হিসাব", "asset", "receivable", true, 30), A("1040", "মজুদ পণ্য", "asset", "inventory", false, 40),
    A("1050", "যন্ত্রপাতি", "asset", "equipment", true, 50),
    A("2010", "ব্যাংক ঋণ", "liability", "loan", true, 60), A("2020", "পাওনাদার/প্রদেয় হিসাব", "liability", "payable", true, 70),
    A("3010", "মূলধন", "equity", "capital", false, 80), A("3020", "মালিকের উত্তোলন", "equity", "drawings", false, 90),
    A("4010", "সেবা আয়", "revenue", "other", false, 100), A("4020", "বিক্রয় আয়", "revenue", "other", false, 110),
    A("5010", "ভাড়া খরচ", "expense", "other", false, 120), A("5020", "বেতন খরচ", "expense", "other", false, 130),
    A("5030", "বিদ্যুৎ ও ইউটিলিটি খরচ", "expense", "other", false, 140), A("5040", "বিক্রীত পণ্যের ব্যয়", "expense", "other", false, 150),
    A("5050", "অন্যান্য খরচ", "expense", "other", false, 160)
  ];
}
function defaultSettings() {
  const n = new Date();
  return { title: "", subtitle: "", digits: "bn", periodType: "month", year: n.getFullYear(), month: n.getMonth() + 1, from: "", to: "", note: "" };
}
let S = { settings: defaultSettings(), accounts: defaultAccounts(), entries: [], audit: [] };
let store = null, USER = "স্থানীয় ব্যবহারকারী", view = "eq", UNDO = [], REDO = [], JSHOW = 50, JSORT = "asc", RSUB = "tb", RACC = "";
let JF = { q: "", from: "", to: "", acc: "", tpl: "" }, AUDQ = "";

const amap = () => Object.fromEntries(S.accounts.map(a => [a.id, a]));
const cmpE = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : ((a.seq || 0) - (b.seq || 0)) || (a.id < b.id ? -1 : 1);
const activeEntries = () => S.entries.filter(e => e.status === "active").sort(cmpE);

/* ---------------- templates ---------------- */
const isCash = a => a.type === "asset" && (a.kind === "cash" || a.kind === "bank");
const SPEC = {
  cash: isCash, receivable: a => a.kind === "receivable", payable: a => a.kind === "payable", loan: a => a.kind === "loan",
  capital: a => a.kind === "capital", drawings: a => a.kind === "drawings", revenue: a => a.type === "revenue", expense: a => a.type === "expense",
  buy: a => a.type === "asset" && (a.kind === "equipment" || a.kind === "inventory" || a.kind === "other"), any: () => true
};
const TPL = {
  capital_in: { l: "মূলধন আনয়ন", dr: "cash", cr: "capital", d: "মূলধন আনয়ন" },
  income_cash: { l: "আয় (নগদে/ব্যাংকে)", dr: "cash", cr: "revenue", d: "" },
  income_credit: { l: "আয় (বাকিতে)", dr: "receivable", cr: "revenue", d: "" },
  expense_cash: { l: "খরচ (নগদে/ব্যাংকে)", dr: "expense", cr: "cash", d: "" },

  buy_cash: { l: "সম্পদ/মালামাল ক্রয় (নগদে)", dr: "buy", cr: "cash", d: "ক্রয়" },
